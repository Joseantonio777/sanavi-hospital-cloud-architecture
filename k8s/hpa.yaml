# ============================================================================
# Grupo Hospitalario SanaVI - Auto-Escalado Horizontal de Pods (HPA v2)
# Responde a picos de demanda hospitalaria, urgencias y cierres de mes
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hce-service-hpa
  namespace: sanavi-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hce-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
