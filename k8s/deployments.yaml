apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-integration-service
  namespace: sanavi-legacy
  labels:
    app: legacy-integration-service
    tier: anti-corruption-layer
    compliance: hipaa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-integration-service
  template:
    metadata:
      labels:
        app: legacy-integration-service
        tier: anti-corruption-layer
    spec:
      containers:
        - name: legacy-hl7-adapter
          image: public.ecr.aws/nginx/nginx:stable-alpine
          ports:
            - containerPort: 80
          env:
            - name: SERVICE_NAME
              value: "SanaVI-Legacy-HL7-FHIR-Adapter"
            - name: SQS_QUEUE
              value: "sanavi-legacy-hl7-integration-queue"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
