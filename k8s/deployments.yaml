# ============================================================================
# Grupo Hospitalario SanaVI - Despliegue de Microservicios Backend en EKS
# 1. hce-service (Historia Clínica Electrónica -> RDS PostgreSQL)
# 2. citas-service (Gestión de Citas Médicas -> DynamoDB SanaVI-Citas)
# 3. inventario-service (Gestión de Inventarios -> DynamoDB SanaVI-Inventario)
# 4. facturacion-service (Facturación y Pagos -> RDS PostgreSQL + S3 KMS)
# 5. legacy-integration-service (Adaptador HL7/FHIR -> SQS Legacy Systems)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hce-service
  namespace: sanavi-prod
  labels:
    app: hce-service
    tier: clinical-core
    compliance: hipaa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hce-service
  template:
    metadata:
      labels:
        app: hce-service
        tier: clinical-core
    spec:
      containers:
        - name: hce-service
          image: public.ecr.aws/nginx/nginx:stable-alpine
          ports:
            - containerPort: 80
          env:
            - name: SERVICE_NAME
              value: "SanaVI-HCE-Electronic-Health-Record"
            - name: DB_ENGINE
              value: "RDS-PostgreSQL-MultiAZ-HIPAA"
            - name: ENCRYPTION_MODE
              value: "AWS-KMS-AES256-TLS1.3"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: hce-service
  namespace: sanavi-prod
spec:
  selector:
    app: hce-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
